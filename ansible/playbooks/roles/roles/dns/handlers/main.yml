---
# Handler with listen directive
- name: restart bind9
  service:
    name: bind9
    state: restarted
  listen: restart dns services

- name: reload bind9
  service:
    name: bind9
    state: reloaded
  listen: restart dns services

- name: test bind configuration
  command: named-checkconf
  changed_when: false
  listen: restart dns services

# Standalone handlers
- name: verify dns service
  wait_for:
    port: 53
    delay: 1
    timeout: 10
    state: started

- name: flush dns cache
  command: rndc flush
  changed_when: false

- name: reload dns zones
  command: rndc reload
  changed_when: false

- name: display bind status
  command: rndc status
  register: bind_status_output
  changed_when: false

- name: show bind status
  debug:
    var: bind_status_output.stdout_lines
  when: bind_status_output is defined
