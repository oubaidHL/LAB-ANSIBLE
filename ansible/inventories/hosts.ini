##############################################
# ANSIBLE LAB INVENTORY
##############################################

# DEV ENVIRONMENT
[dev_web]
node1 ansible_host=172.20.0.11
node2 ansible_host=172.20.0.12

[dev_dns]
node3 ansible_host=172.20.0.13

[dev_nagios]
node4 ansible_host=172.20.0.14

[dev:children]
dev_web
dev_dns
dev_nagios


# TEST ENVIRONMENT
[test_web]
node5 ansible_host=172.20.0.15

[test_dns]
node6 ansible_host=172.20.0.16

[test_nagios]
node7 ansible_host=172.20.0.17

[test:children]
test_web
test_dns
test_nagios


# PROD ENVIRONMENT
[prod_web]
node8 ansible_host=172.20.0.18
node9 ansible_host=172.20.0.19

[prod_dns]
node10 ansible_host=172.20.0.20

[prod_nagios]
node11 ansible_host=172.20.0.21

[prod:children]
prod_web
prod_dns
prod_nagios


# SERVICE GROUPS (across all environments)
[web:children]
dev_web
test_web
prod_web

[dns:children]
dev_dns
test_dns
prod_dns

[nagios:children]
dev_nagios
test_nagios
prod_nagios


# GLOBAL VARIABLES
[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/ansible/secrets/keys/id_rsa
ansible_python_interpreter=/usr/bin/python3
